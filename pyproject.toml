[project]
name = "optionsfilter"
version = "0.1.0"
description = "Read-only Python client for the Robinhood MCP server: stock quotes, fundamentals and option-chain filtering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
optionsfilter = "optionsfilter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
